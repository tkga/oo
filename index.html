<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>สมุดรายรับรายจ่าย</title>
<meta name="description" content="แอพบันทึกรายรับรายจ่าย แยกตามหมวดและบัญชี พร้อมงบประมาณและเป้าหมายการออม">
<meta name="theme-color" content="#2347C9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="รายรับรายจ่าย">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
</style>
<style>
/* Layout: bottom tab bar on phones, left rail on wide screens; one scrolling page per tab; cool ink-blue ledger with thin rules, figures set in Bai Jamjuree. */
:root{
  --font-display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --font-body:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
  --bg:#EDF0F5; --surface:#FFFFFF; --surface2:#F3F5F9; --fg:#111A2B; --fg2:#47536A; --muted:#6B778D;
  --line:#DCE2EC; --accent:#2347C9; --accent-fg:#FFFFFF; --accent-soft:#E3E9FB;
  --pos:#0A7646; --pos-bg:#DDF2E7;
  --ok:#0ca30c; --warn:#fab219; --crit:#d03b3b;
  --ok-t:#006300; --warn-t:#855400; --crit-t:#B02525;
  --ok-bg:#E1F4E1; --warn-bg:#FDF0CF; --crit-bg:#FBE4E4;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#6250d6; --c8:#e34948; --c9:#8A93A3;
  --inc:var(--c3); --exp:var(--c2);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B101A; --surface:#141B28; --surface2:#1B2434; --fg:#EAF0FA; --fg2:#B4BFD0; --muted:#8C98AD;
    --line:#263044; --accent:#86A0FF; --accent-fg:#0B101A; --accent-soft:#1F2B55;
    --pos:#5FD39A; --pos-bg:#12301F;
    --ok-t:#5FD35F; --warn-t:#F5C04A; --crit-t:#F08080;
    --ok-bg:rgba(12,163,12,.18); --warn-bg:rgba(250,178,25,.16); --crit-bg:rgba(208,59,59,.2);
    --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767; --c9:#7B8496;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B101A; --surface:#141B28; --surface2:#1B2434; --fg:#EAF0FA; --fg2:#B4BFD0; --muted:#8C98AD;
  --line:#263044; --accent:#86A0FF; --accent-fg:#0B101A; --accent-soft:#1F2B55;
  --pos:#5FD39A; --pos-bg:#12301F;
  --ok-t:#5FD35F; --warn-t:#F5C04A; --crit-t:#F08080;
  --ok-bg:rgba(12,163,12,.18); --warn-bg:rgba(250,178,25,.16); --crit-bg:rgba(208,59,59,.2);
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767; --c9:#7B8496;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55;
  padding-block:16px 104px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:26px;font-weight:700}
h2{font-size:17px;font-weight:600}
h3{font-size:16px;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
[hidden]{display:none!important}

/* shell */
.main{max-width:880px;margin:0 auto}
.page{display:none;flex-direction:column;gap:16px}
.page.on{display:flex}
.ph{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.mbar{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.mbar button{border:0;background:transparent;width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1;color:var(--fg2)}
.mbar button:hover:not(:disabled){background:var(--surface2)}
.mbar button:disabled{opacity:.35;cursor:default}
.mlabel{min-width:128px;text-align:center;font-weight:500;font-size:14px;padding-inline:4px}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:10.5px;font-weight:500;white-space:nowrap}
.nav a svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.brand{display:none}
@media (min-width:900px){
  body{padding-block:24px 48px;padding-left:calc(224px + max(16px,env(safe-area-inset-left,0px)))}
  .nav{top:0;right:auto;bottom:0;width:208px;flex-direction:column;gap:4px;border-top:0;border-right:1px solid var(--line);
    padding:calc(20px + env(safe-area-inset-top,0px)) 12px 20px max(12px,env(safe-area-inset-left,0px))}
  .nav a{flex:none;flex-direction:row;gap:12px;padding:10px 12px;font-size:15px}
  .brand{display:block;font-family:var(--font-display);font-weight:700;font-size:19px;padding:4px 12px 16px;line-height:1.2}
  .brand small{display:block;font-family:var(--font-body);font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.card-h a,.link{color:var(--accent);font-size:13px;text-decoration:none;font-weight:500;background:none;border:0;padding:0}
.card-h a:hover,.link:hover{text-decoration:underline}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;background:var(--accent-soft);border-radius:12px;padding:12px 16px;font-size:14px}
.banner.warn{background:var(--warn-bg)}
.empty{text-align:center;padding:28px 12px;color:var(--fg2);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty b{font-family:var(--font-display);font-size:17px;color:var(--fg)}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);border-radius:10px;padding:10px 16px;font-weight:600;text-decoration:none}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft);filter:none}
.btn.danger{background:var(--crit);border-color:var(--crit);color:#fff}
.btn.ghost.danger{background:transparent;color:var(--crit-t);border-color:var(--crit)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.in{width:100%;min-width:0;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--fg)}
.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
select.in{appearance:auto}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>span,.lab{font-size:13px;font-weight:500;color:var(--fg2)}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.seg2{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg2 button{border:0;background:transparent;padding:7px 14px;border-radius:8px;font-weight:500;color:var(--fg2);font-size:14px}
.seg2 button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
.seg2 button.exp[aria-pressed="true"]{color:var(--fg)}
.err{color:var(--crit-t);font-size:13px}
.amt-wrap{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:6px 14px}
.amt-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.amt-wrap b{font-family:var(--font-display);font-size:26px;color:var(--muted)}
.amt-wrap input{flex:1;min-width:0;border:0;background:transparent;font-family:var(--font-display);font-size:30px;font-weight:600;padding:4px 0;outline:none;font-variant-numeric:tabular-nums}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:8px}
.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;text-align:left;font-size:14px;min-width:0}
.chip span:not(.ico){white-space:normal;overflow-wrap:anywhere;line-height:1.3;min-width:0}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.chip.add{border-style:dashed;color:var(--accent);justify-content:center}
.newcat{display:flex;gap:8px;margin-top:8px}
.form-actions{display:flex;gap:8px;flex-wrap:wrap}
.form{display:flex;flex-direction:column;gap:14px}
.form-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}

/* pills + bars */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--surface2);color:var(--fg2)}
.pill svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pill.ok{background:var(--ok-bg);color:var(--ok-t)}
.pill.warn{background:var(--warn-bg);color:var(--warn-t)}
.pill.crit{background:var(--crit-bg);color:var(--crit-t)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.track{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.track i{display:block;height:100%;border-radius:0 4px 4px 0;min-width:2px}

/* home */
.hero{padding:20px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.big{font-family:var(--font-display);font-weight:700;font-size:clamp(34px,9vw,46px);line-height:1.1;margin:6px 0 14px;font-variant-numeric:tabular-nums}
.big.neg{color:var(--crit-t)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.split div{display:flex;flex-direction:column;gap:2px;min-width:0}
.split b{font-family:var(--font-display);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:baseline}
.stats3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--font-display);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat small{color:var(--muted);font-size:12.5px}
.delta{font-weight:600}
.delta.up{color:var(--warn-t)}
.delta.down{color:var(--ok-t)}
.donut-wrap{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:20px;align-items:center}
@media (max-width:560px){.donut-wrap{grid-template-columns:1fr;justify-items:center}.donut-wrap .ranks{width:100%}}
.donut{position:relative;width:200px;max-width:100%;aspect-ratio:1}
.donut svg{width:100%;height:100%;display:block}
.seg{fill:none;stroke-width:26;transition:opacity .15s;cursor:pointer;outline:none}
.seg:focus-visible{stroke-width:30}
.dim{opacity:.35}
.dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 38px;pointer-events:none;gap:0}
.dc small{font-size:12px;color:var(--muted);line-height:1.3}
.dc b{font-family:var(--font-display);font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.dc em{font-style:normal;font-size:12px;color:var(--fg2)}
.ranks{display:flex;flex-direction:column;gap:2px;min-width:0}
.rank{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;background:transparent;border:0;border-radius:8px;padding:7px 8px;transition:opacity .15s;width:100%}
.rank:hover{background:var(--surface2)}
.rk-n{display:flex;align-items:center;gap:8px;min-width:0;font-weight:500}
.rk-n span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk-a{font-variant-numeric:tabular-nums;font-weight:500;text-align:right}
.rank .track{grid-column:1 / -1}
.rk-p{color:var(--muted);font-size:12.5px;font-weight:400;margin-left:4px}
.dot{width:10px;height:10px;border-radius:3px;flex:none}

/* transactions */
.txs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tx{border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.tx-btn{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;background:transparent;border:0;padding:10px 2px;text-align:left}
.tx-btn:hover{background:var(--surface2)}
.ico{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;font-size:19px;background:color-mix(in srgb,var(--c,var(--c9)) 20%,var(--surface));flex:none}
.tx-main{display:flex;flex-direction:column;min-width:0}
.tx-main b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-main small{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-amt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.tx-amt.pos{color:var(--pos)}
.tx-act{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:2px 2px 12px 52px;font-size:13px}
.dgroup{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px;font-size:13px;font-weight:600;color:var(--fg2);padding:14px 2px 4px;border-bottom:1px solid var(--line)}
.dgroup:first-child{padding-top:2px}
.filters{display:flex;flex-direction:column;gap:10px}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px}

/* stats */
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--fg2)}
.chart{display:grid;grid-template-columns:34px minmax(0,1fr);gap:6px;margin-top:10px}
.yax{height:170px;display:flex;flex-direction:column;justify-content:space-between;text-align:right;font-size:11px;color:var(--muted);line-height:1;font-variant-numeric:tabular-nums}
.yax span:first-child{transform:translateY(-1px)}
.plot{position:relative;min-width:0}
.lines{position:absolute;left:0;right:0;top:0;height:170px;pointer-events:none}
.lines i{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.cols{position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:2px}
.col{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:transparent;padding:0 0 4px;border-radius:8px;min-width:0}
.col.sel{background:var(--surface2)}
.pair{height:170px;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:2px}
.b{display:block;flex:0 1 14px;max-width:14px;border-radius:4px 4px 0 0;min-height:0}
.b.inc{background:var(--inc)}
.b.exp{background:var(--exp)}
.cl{font-size:11px;color:var(--muted);white-space:nowrap}
.readout{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:14px}
.readout b{font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto;margin-inline:-4px;padding-inline:4px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:460px}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:0}
td .cn{display:flex;align-items:center;gap:8px;font-weight:500}

/* budget + goals */
.brow{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0}
.brow-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brow-top .nm{display:flex;align-items:center;gap:10px;font-weight:500;flex:1;min-width:140px}
.brow-nums{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;font-size:13px;color:var(--fg2)}
.bud-in{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--fg2)}
.bud-in input{width:104px;text-align:right}
.goal{display:flex;flex-direction:column;gap:12px}
.g-top{display:flex;align-items:center;gap:12px}
.g-top>div{flex:1;min-width:0}
.g-nums{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.g-nums b{font-family:var(--font-display);font-size:24px;font-variant-numeric:tabular-nums}
.g-dep{display:flex;flex-wrap:wrap;gap:8px}
.g-dep .in{flex:1;min-width:110px}
.panel{background:var(--surface2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}

/* prefs */
.crow{border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.crow>button.head{display:flex;align-items:center;gap:12px;width:100%;background:transparent;border:0;padding:10px 2px;text-align:left}
.crow .head span.nm{flex:1;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis}
.editor{padding:4px 2px 14px;display:flex;flex-direction:column;gap:12px}
.emojis{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.emojis button{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:19px}
.emojis button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches button{width:32px;height:32px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
.mrow{display:flex;gap:8px;align-items:center;padding:6px 0}
.mrow .in{flex:1}
.set-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding:10px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.stack{display:flex;flex-direction:column;gap:12px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
textarea.in{min-height:96px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.switch{position:relative;width:46px;height:26px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.switch i{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:background .15s}
.switch i::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked+i{background:var(--accent)}
.switch input:checked+i::after{transform:translateX(20px)}

function fillDemo(s){
  var rnd=mulberry(20261101);

  var now=new Date(), tk=iso(now).slice(0,7), n=0;

  for(var k=-6;k<=0;k++){
    var key=addMonths(tk,k), last=k===0?now.getDate():daysIn(key), dim=daysIn(key);
    var add=function(day,type,amt,cat,note,m){ if(day>last) return; s.tx.push({id:uid(),ts:n++,type:type,amt:amt,cat:cat,date:key+'-'+p2(day),note:note,m:m||wm()}) };
    add(25,'income',28000,'i-salary','เงินเดือน','m-transfer');
    add(Ri(8,20),'income',Ri(20,70)*100,'i-side','งานฟรีแลนซ์','m-transfer');
    if(k===-3) add(15,'income',15000,'i-bonus','โบนัสกลางปี','m-transfer');
    add(28,'income',Ri(80,250),'i-invest','ดอกเบี้ยเงินฝาก','m-transfer');
    add(1,'expense',7500,'e-home','ค่าเช่าห้อง','m-transfer');
    add(5,'expense',Ri(600,1100),'e-home','ค่าไฟ','m-wallet');
    add(6,'expense',Ri(120,220),'e-home','ค่าน้ำ','m-wallet');
    add(8,'expense',599,'e-home','ค่าอินเทอร์เน็ต','m-credit');
    add(12,'expense',419,'e-fun','สมาชิกสตรีมมิ่ง','m-credit');
    for(var d=1;d<=Math.min(last,dim);d++){
      var dow=new Date(+key.slice(0,4),+key.slice(5,7)-1,d).getDay(), meals=rnd()<.85?(rnd()<.6?2:1):0;
      for(var j=0;j<meals;j++) add(d,'expense',Ri(40,260),'e-food',pick(['ข้าวมันไก่','กาแฟ','ก๋วยเตี๋ยว','ข้าวหมูกรอบ','สั่งอาหารเดลิเวอรี','ชานมไข่มุก','ข้าวแกง']));
      if(rnd()<.12) add(d,'expense',Ri(300,900),'e-food','มื้อเย็นกับเพื่อน');
      if(dow>0&&dow<6&&rnd()<.7) add(d,'expense',Ri(25,62),'e-trans','ค่ารถไฟฟ้า','m-wallet');
      if(rnd()<.08) add(d,'expense',Ri(90,280),'e-trans','แท็กซี่แอป');
    }
    add(Ri(2,12),'expense',Ri(250,2600),'e-shop',pick(['Shopee','เสื้อผ้า','ของใช้ในบ้าน','Lazada']));
    add(Ri(14,27),'expense',Ri(250,2600),'e-shop',pick(['Shopee','รองเท้า','ของใช้ในบ้าน','Lazada']));
    if(rnd()<.6) add(Ri(3,27),'expense',Ri(150,900),'e-health',pick(['ซื้อยา','ตรวจสุขภาพ','วิตามิน']));
    add(Ri(15,27),'expense',Ri(120,650),'e-fun',pick(['ดูหนัง','เกม','คอนเสิร์ต']));
    if(k%2===0) add(Ri(3,25),'expense',Ri(500,1800),'e-edu','คอร์สออนไลน์');
    add(Ri(4,26),'expense',Ri(100,500),'e-other','ของจิปาถะ');

/* ---------- state ---------- */
var LS_KEY='sumud-raurap-v1', storageOK=true;
function load(){
  try{var r=localStorage.getItem(LS_KEY);if(r){var o=JSON.parse(r);if(o&&Array.isArray(o.tx)&&Array.isArray(o.cats)&&Array.isArray(o.methods))return o}}catch(e){storageOK=false}
  return null;
}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){storageOK=false}}
try{localStorage.setItem('__t','1');localStorage.removeItem('__t')}catch(e){storageOK=false}
function normalize(o){
  o.set=o.set||{};if(!o.set.cur)o.set.cur='฿';if(o.set.be===undefined)o.set.be=true;if(!o.set.theme)o.set.theme='auto';
  o.budgets=o.budgets||{};o.opening=o.opening&&typeof o.opening.amount==='number'?o.opening:{amount:0,date:''};o.xfers=Array.isArray(o.xfers)?o.xfers:[];o.methods.forEach(function(m){if(typeof m.open!=='number')m.open=0});o.goals=Array.isArray(o.goals)?o.goals:[];
  o.goals.forEach(function(g){g.hist=Array.isArray(g.hist)?g.hist:[];g.icon=g.icon||'🎯'});
  o.tx.forEach(function(t,i){if(t.ts==null)t.ts=i});
  return o;
}
var S=normalize(load()||freshState(true));
var now0=new Date(), todayISO=iso(now0), curKey=todayISO.slice(0,7);
var M=curKey;

/* ---------- selectors ---------- */
function yl(y){return S.set.be?y+543:y}
function monthFull(k){var a=k.split('-').map(Number);return TH_MF[a[1]-1]+' '+yl(a[0])}
function monthShort(k){var a=k.split('-').map(Number);return TH_M[a[1]-1]}
function monthShortY(k){var a=k.split('-').map(Number);return TH_M[a[1]-1]+' '+yl(a[0])}
function dayLabel(s){var d=parseD(s);return TH_DS[d.getDay()]+' '+d.getDate()+' '+TH_M[d.getMonth()]+' '+yl(d.getFullYear())}
function money(n){var a=Math.abs(n);return (n<0?'−':'')+S.set.cur+nf.format(a)}
function money0(n){return (n<0?'−':'')+S.set.cur+nf0.format(Math.abs(n))}
function compact(n){return n>=1e6?(Math.round(n/1e5)/10)+'M':n>=1000?(Math.round(n/100)/10)+'k':String(Math.round(n))}
function catOf(id){return S.cats.find(function(c){return c.id===id})||{id:id,name:'ไม่ระบุหมวด',icon:'🏷️',color:9,type:'expense'}}
function methOf(id){return S.methods.find(function(m){return m.id===id})}
function cv(c){return 'var(--c'+c.color+')'}
function inMonth(key,type){return S.tx.filter(function(t){return t.date.slice(0,7)===key&&(!type||t.type===type)})}
function sum(a){return a.reduce(function(s,t){return s+t.amt},0)}
function balanceAt(d){
  var o=S.opening, b=o.amount+S.methods.reduce(function(s,m){return s+(+m.open||0)},0);
  return b+S.tx.reduce(function(s,t){return (t.date>=(o.date||'')&&t.date<=d)?s+(t.type==='income'?t.amt:-t.amt):s},0);
}
function acctBal(id){
  var m=methOf(id),b=m?+m.open||0:0;
  S.tx.forEach(function(t){if(t.m===id)b+=t.type==='income'?t.amt:-t.amt});
  S.xfers.forEach(function(x){if(x.from===id)b-=x.amt;if(x.to===id)b+=x.amt});
  return Math.round(b*100)/100;
}
function unalloc(){
  var b=S.opening.amount;
  S.tx.forEach(function(t){if(!methOf(t.m))b+=t.type==='income'?t.amt:-t.amt});
  return Math.round(b*100)/100;
}
function mIcon(m){var k={'m-cash':'💵','m-transfer':'🏦','m-credit':'💳','m-debit':'🏧','m-wallet':'📱'};return k[m.id]||(m.credit?'💳':'👛')}
function mName(id){var m=methOf(id);return m?m.name:'บัญชีที่ลบแล้ว'}
function cmpTx(a,b){return b.date.localeCompare(a.date)||(b.ts||0)-(a.ts||0)}
function byCat(key,type){
  var m={};inMonth(key,type||'expense').forEach(function(t){var o=m[t.cat]||(m[t.cat]={cat:catOf(t.cat),total:0,count:0});o.total+=t.amt;o.count++});

}

function rankRows(list,total){
  if(!list.length)return '';

    var tag=list.length>=3&&i===0?' <span class="pill acc">มากสุด</span>':(list.length>=3&&i===list.length-1?' <span class="pill">น้อยสุด</span>':'');

      '<span class="rk-a num">'+money0(x.total)+'<span class="rk-p">'+pct(x.total,total)+'%</span></span>'+
      '<span class="track" aria-hidden="true"><i style="width:'+Math.max(2,x.total/max*100)+'%;background:'+cv(x.cat)+'"></i></span></button>';

var MAXS=8;
function donutSVG(list,total){
  var segs=list.slice(0,MAXS);
  if(list.length>MAXS){var rest=list.slice(MAXS-1);segs=list.slice(0,MAXS-1);segs.push({cat:{name:'หมวดอื่นรวมกัน',icon:'',color:9},total:sum(rest.map(function(r){return {amt:r.total}})),count:0})}
  var R=70,C=2*Math.PI*R,off=0,gap=segs.length>1?2:0,out='';
  segs.forEach(function(s,i){
    var len=s.total/total*C;
    out+='<circle class="seg" data-i="'+i+'" tabindex="0" role="img" aria-label="'+esc(s.cat.name)+' '+pct(s.total,total)+'%" cx="90" cy="90" r="'+R+'" style="stroke:'+cv(s.cat)+'" stroke-dasharray="'+Math.max(len-gap,.5)+' '+C+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 90 90)"/>';
    off+=len;
  });
  return {svg:'<svg viewBox="0 0 180 180" role="group" aria-label="สัดส่วนรายจ่ายแยกตามหมวด">'+out+'</svg>',segs:segs,fold:list.length>MAXS?MAXS-1:null};
}
function bindDonut(root,d,total){
  var dc=$('.dc',root); if(!dc)return;
  var def='<small>ใช้จ่ายรวม</small><b>'+money0(total)+'</b>';
  function segIdx(i){return d.fold!=null&&i>=d.fold?d.fold:i}
  function set(i){
    $$('.seg',root).forEach(function(s){s.classList.toggle('dim',i!=null&&+s.dataset.i!==i)});
    $$('.rank',root).forEach(function(r){r.classList.toggle('dim',i!=null&&segIdx(+r.dataset.i)!==i)});
    if(i==null){dc.innerHTML=def;return}
    var s=d.segs[i];dc.innerHTML='<small>'+esc((s.cat.icon?s.cat.icon+' ':'')+s.cat.name)+'</small><b>'+money0(s.total)+'</b><em>'+pct(s.total,total)+'%</em>';
  }
  $$('[data-i]',root).forEach(function(el){
    var i=segIdx(+el.dataset.i);
    el.addEventListener('pointerenter',function(){set(i)});
    el.addEventListener('pointerleave',function(){set(null)});
    el.addEventListener('focus',function(){set(i)});
    el.addEventListener('blur',function(){set(null)});
    el.addEventListener('click',function(){set(i)});
  });
}
function budgetAlerts(key){
  var spent={};inMonth(key,'expense').forEach(function(t){spent[t.cat]=(spent[t.cat]||0)+t.amt});
  return S.cats.filter(function(c){return c.type==='expense'&&S.budgets[c.id]>0}).map(function(c){return {c:c,sp:spent[c.id]||0,b:S.budgets[c.id],p:(spent[c.id]||0)/S.budgets[c.id]}})
    .filter(function(x){return x.p>=.8}).sort(function(a,b){return b.p-a.p});
}

      '<div class="cols" style="--n:'+data.length+'">'+data.map(function(d){

  if(!cur.length) h+='<p class="muted">เดือนนี้ยังไม่มีรายจ่าย</p>';

  var cats=S.cats.filter(function(c){return c.type==='expense'});
  var withB=cats.filter(function(c){return S.budgets[c.id]>0}).sort(function(a,b){return (spent[b.id]||0)/S.budgets[b.id]-(spent[a.id]||0)/S.budgets[a.id]});
  var noB=cats.filter(function(c){return !(S.budgets[c.id]>0)});

  h+='<p class="small muted">เงินที่ฝากเข้าเป้าหมายไม่ถูกนับเป็นรายจ่ายในหน้าอื่น</p>';
  $('#p-goals').innerHTML=h;

/* ---------- export / import ---------- */
function csvText(){
  var q=function(s){return '"'+String(s==null?'':s).replace(/"/g,'""')+'"'};
  var rows=[['วันที่','ประเภท','หมวดหมู่','จำนวนเงิน','ช่องทาง','โน้ต'].map(q).join(',')];
  S.tx.slice().sort(cmpTx).forEach(function(t){var m=methOf(t.m);rows.push([t.date,t.type==='income'?'รายรับ':'รายจ่าย',catOf(t.cat).name,t.amt,m?m.name:'',t.note].map(q).join(','))});
  return '﻿'+rows.join('\r\n');
}
async function doExport(kind){
  var data=kind==='csv'?csvText():JSON.stringify(S,null,1), name=kind==='csv'?'income-expense.csv':'income-expense-backup.json';
  var dl=null;try{dl=await (window.claude&&window.claude.use?window.claude.use('downloads'):null)}catch(e){dl=null}
  if(!dl){
    try{var blob=new Blob([data],{type:kind==='csv'?'text/csv;charset=utf-8':'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();var u=a.href;setTimeout(function(){URL.revokeObjectURL(u)},1500);toast('บันทึกไฟล์แล้ว')}
    catch(e){exportText=data;renderPrefs()}
    return;
  }
  try{await dl.save({filename:name,data:data});toast('บันทึกไฟล์แล้ว')}
  catch(e){if(e&&e.code==='declined')return;exportText=data;renderPrefs()}
}
function parseImport(txt){
  var o;try{o=JSON.parse(txt)}catch(e){return null}
  if(!o||!Array.isArray(o.tx)||!Array.isArray(o.cats)||!Array.isArray(o.methods))return null;
  return o;
}

/* ---------- router + render ---------- */
var PAGES=['home','record','accounts','stats','budget','goals','prefs'];
function route(){var h=location.hash.replace('#','');return PAGES.indexOf(h)>=0?h:'home'}
function render(){
  var pg=route();
  $$('.page').forEach(function(p){p.classList.toggle('on',p.dataset.page===pg)});
  $$('[data-nav]').forEach(function(a){if(a.dataset.nav===pg)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  if(pg==='home')renderHome();
  else if(pg==='record')renderRecord();
  else if(pg==='accounts')renderAccounts();
  else if(pg==='stats')renderStats();
  else if(pg==='budget')renderBudget();
  else if(pg==='goals')renderGoals();
  else renderPrefs();
}
window.addEventListener('hashchange',function(){render();window.scrollTo(0,0)});

document.addEventListener('change',function(e){
  var t=e.target,f=t.dataset&&t.dataset.f;
  if(t.id==='rfMonth'){rf.month=t.value;renderTxList();return}
  if(t.id==='rfType'){rf.type=t.value;renderTxList();return}
  if(t.id==='rfCat'){rf.cat=t.value;renderTxList();return}
  if(t.id==='rfMethod'){rf.method=t.value;renderTxList();return}
  if(!f)return;
  if(f==='budget'){var v=parseFloat(String(t.value).replace(/,/g,''));if(v>0)S.budgets[t.dataset.id]=Math.round(v);else delete S.budgets[t.dataset.id];commit();return}
  if(f==='cname'){var c=S.cats.find(function(x){return x.id===t.dataset.id});var n=t.value.trim();if(c&&n){c.name=n;commit()}return}
  if(f==='mname'){var m=S.methods.find(function(x){return x.id===t.dataset.id});var n2=t.value.trim();if(m&&n2){m.name=n2;commit()}return}
  if(f==='open'){var ov=parseFloat(String(t.value).replace(/,/g,''));S.opening.amount=isNaN(ov)?0:ov;commit();return}
  if(f==='mopen'){var mo=S.methods.find(function(x){return x.id===t.dataset.id});var mv=parseFloat(String(t.value).replace(/,/g,''));if(mo){mo.open=isNaN(mv)?0:Math.round(mv*100)/100;commit()}return}
  if(f==='mcredit'){var mm=S.methods.find(function(x){return x.id===t.dataset.id});if(mm){mm.credit=t.checked;commit()}return}
  if(f==='cur'){S.set.cur=t.value;commit();return}
  if(f==='be'){S.set.be=t.checked;commit();return}
  var g=S.goals.find(function(x){return x.id===t.dataset.id});if(!g)return;
  if(f==='gname'&&t.value.trim()){g.name=t.value.trim();commit()}
  else if(f==='gtarget'&&parseFloat(t.value)>0){g.target=parseFloat(t.value);commit()}
  else if(f==='gdate'){g.deadline=t.value||'';commit()}
});
document.addEventListener('input',function(e){if(e.target.id==='rfQ'){rf.q=e.target.value.trim().toLowerCase();listLimit=60;renderTxList()}});
$('#txForm').addEventListener('submit',submitForm);
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.id==='ncName'){e.preventDefault();A.ncsave()}
  if(e.key==='Enter'&&e.target.id==='newMeth'){e.preventDefault();A.madd()}
});

/* ---------- init ---------- */
applyTheme();
$('#fDate').value=todayISO;
render();
})();
</script>

if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
